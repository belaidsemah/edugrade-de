stages: [security, build, scan-image, deploy, dast]
variables: { GIT_DEPTH: "0" }

.trivy: &trivy
  image: { name: aquasec/trivy:latest, entrypoint: [""] }

gitleaks:
  stage: security
  image: { name: zricethezav/gitleaks:latest, entrypoint: [""] }
  script: [gitleaks detect --source . --redact -v]

sast-semgrep:
  stage: security
  image: semgrep/semgrep:latest
  script: [semgrep scan --config p/owasp-top-ten --error app/]

deps-trivy:
  <<: *trivy
  stage: security
  script: [trivy fs --severity CRITICAL,HIGH --exit-code 1 app/]

iac-trivy:
  <<: *trivy
  stage: security
  script: [trivy config --severity CRITICAL,HIGH --exit-code 1 .]

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables: { DOCKER_TLS_CERTDIR: "/certs" }
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA app/
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

image-trivy:
  <<: *trivy
  stage: scan-image
  variables: { TRIVY_USERNAME: $CI_REGISTRY_USER, TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD }
  script: [trivy image --severity CRITICAL,HIGH --exit-code 1 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA]

# Les 2 jobs suivants exigent un 2e runner (executor shell, tag k8s-local) sur la machine ou tourne kind
deploy:
  stage: deploy
  tags: [k8s-local]
  rules: [{ if: '$CI_COMMIT_BRANCH == "main"' }]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - kind load docker-image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --name edugrade
    - kubectl -n edugrade set image deployment/edugrade app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - kubectl -n edugrade rollout status deployment/edugrade --timeout=120s

dast-zap:
  stage: dast
  tags: [k8s-local]
  rules: [{ if: '$CI_COMMIT_BRANCH == "main"' }]
  script:
    - kubectl -n edugrade port-forward svc/edugrade 5000:5000 & sleep 5
    - |
      TOKEN=$(curl -s -X POST localhost:5000/login -H 'Content-Type: application/json' \
        -d "{\"email\":\"alice@edugrade.test\",\"password\":\"$DAST_PASSWORD\"}" \
        | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
    - |
      docker run --rm --network host -v $PWD:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py -t /zap/wrk/app/openapi.yaml -f openapi -r zap.html \
        -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).replacement='Bearer $TOKEN'"
  artifacts: { paths: [zap.html], when: always }
