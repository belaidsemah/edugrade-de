services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: edugrade
      POSTGRES_USER: edugrade
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
  app:
    build: ./app
    ports: ["5000:5000"]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
    depends_on: [db]
    restart: on-failure
