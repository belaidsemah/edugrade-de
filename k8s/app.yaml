apiVersion: v1
kind: ServiceAccount
metadata: { name: edugrade-sa, namespace: edugrade }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edugrade, namespace: edugrade }
spec:
  replicas: 1
  selector: { matchLabels: { app: edugrade } }
  template:
    metadata: { labels: { app: edugrade } }
    spec:
      serviceAccountName: edugrade-sa
      containers:
      - name: app
        image: edugrade:1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 5000 }]
        env:
        - { name: DB_HOST, value: postgres }
        - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: edugrade-secrets, key: JWT_SECRET } } }
        - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: edugrade-secrets, key: DB_PASSWORD } } }
        readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 5 }
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: edugrade, namespace: edugrade }
spec:
  selector: { app: edugrade }
  ports: [{ port: 5000, targetPort: 5000 }]
