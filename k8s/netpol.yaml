apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: edugrade }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-app, namespace: edugrade }
spec:
  podSelector: { matchLabels: { app: edugrade } }
  policyTypes: [Ingress, Egress]
  ingress: [{ ports: [{ port: 5000 }] }]
  egress:
  - to: [{ podSelector: { matchLabels: { app: postgres } } }]
    ports: [{ port: 5432 }]
  - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-db, namespace: edugrade }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
  - from: [{ podSelector: { matchLabels: { app: edugrade } } }]
    ports: [{ port: 5432 }]
