apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: edugrade }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: postgres
        image: postgres:16
        ports: [{ containerPort: 5432 }]
        env:
        - { name: POSTGRES_DB, value: edugrade }
        - { name: POSTGRES_USER, value: edugrade }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: edugrade-secrets, key: DB_PASSWORD } } }
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        - { name: run, mountPath: /var/run/postgresql }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
      - { name: data, emptyDir: {} }
      - { name: run, emptyDir: {} }
      - { name: init, configMap: { name: init-sql } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: edugrade }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
